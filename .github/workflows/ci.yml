name: CI

on:
  pull_request:
    branches: [develop, main, preview]
  push:
    # preview is the temporary v0.4.0 evolution integration branch:
    # feature branches merge there (not develop) until stabilization.
    branches: [develop, main, preview]

permissions:
  contents: read

jobs:
  python:
    name: Python lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install workspace
        run: make install
      - name: Lint
        run: make lint
      - name: Type-check
        run: make typecheck
      # Release gates: a failure here stops a release, so they get
      # their own step to be legible in the checks UI. `make test` reruns them.
      - name: Security corpora (SSRF + prompt injection)
        run: make security
      - name: Test
        run: make test

  # OCI layer digests are over the compressed pack bytes, so identical trees
  # must gzip identically on every OS/zlib build — and the image manifest
  # digest built on top must match too. The pinned-digest tests in
  # test_packer.py and test_runtime_image.py prove it; run them on both
  # platforms we target.
  pack-determinism:
    name: "Pack digest determinism (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install workspace
        run: make install
      - name: Packer + image suites incl. pinned cross-OS digests
        run: |
          uv run --no-sync pytest \
            packages/okf-core/tests/test_packer.py \
            packages/oknoll-runtime/tests/test_runtime_image.py -v
