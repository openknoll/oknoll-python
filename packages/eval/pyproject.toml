[project]
name = "oknoll-eval"
version = "0.1.0"
description = "OpenKnoll PD-vs-RAG evaluation harness: corpora, runner, grading, metrics, reports"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "okf-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oknoll_eval"]
