[[questions]]
id = "q21"
bundle = "ripgrep"
class = "multi-hop"
question = "If you want to embed ripgrep's search functionality in your own Rust program, which crate is the intended entry point, and how does that crate describe itself?"
# The answer lives in crates/grep/README.md: "ripgrep, as a library".
# source-015 = crates/grep/README.md
gold_evidence = ["references/source-015.md"]

[[questions]]
id = "q22"
bundle = "ripgrep"
class = "multi-hop"
question = "Which crate implements the recursive directory traversal that respects .gitignore rules, and what lower-level access does it also expose?"
# The question is phrased in terms of ripgrep's gitignore behavior; the answer
# lives in crates/ignore/README.md (direct access to gitignore and file type
# matchers). source-016 = crates/ignore/README.md
gold_evidence = ["references/source-016.md"]

[[questions]]
id = "q23"
bundle = "ripgrep"
class = "trust"
question = "What changes are documented for the next, unreleased version of ripgrep?"
# The CHANGELOG's top section is "TBD — Release notes have not yet been
