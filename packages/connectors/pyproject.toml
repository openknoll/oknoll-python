[project]
name = "oknoll-connectors"
version = "0.3.1"
description = "OpenKnoll first-party connectors (files, web, github, transcript) + plugin SDK"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "okf-core==0.3.1",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pytest>=8.0",
    "certifi>=2024.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oknoll_connectors"]
