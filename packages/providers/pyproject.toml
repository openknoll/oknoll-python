[project]
name = "oknoll-providers"
version = "0.3.1"
description = "Real model providers (Anthropic API, Ollama) behind the okf-core ModelProvider seam"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "okf-core==0.3.1",
    "anthropic>=0.60",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oknoll_providers"]
