[project]
# Distribution name is `oknoll` (uv tool install oknoll); the import package
# stays `oknoll_cli` and the directory keeps its historical name.
name = "oknoll"
version = "0.3.3"
description = "oknoll: local-first CLI for building, linting, exploring, and packing OKF bundles"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "okf-core==0.3.3",
    "oknoll-connectors==0.3.3",
    "oknoll-eval==0.3.3",
    "oknoll-providers==0.3.3",
    "oknoll-runtime==0.3.3",
    "typer>=0.15",
    "mcp>=1.9",
]

[project.scripts]
oknoll = "oknoll_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oknoll_cli"]
