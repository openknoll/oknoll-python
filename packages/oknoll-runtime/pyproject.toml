[project]
name = "oknoll-runtime"
version = "0.4.0"
description = "OpenKnoll local runtime: content-addressed store, OkNoll OCI images, catalog, locators"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "okf-core==0.4.0",
    "platformdirs>=4.0",
    "mcp>=2.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oknoll_runtime"]
