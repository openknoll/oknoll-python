[project]
name = "okf-core"
version = "0.1.0"
description = "OpenKnoll core: CanonicalDoc, OKF v0.2 parser/writer, lint, pipeline, indexes, packer"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okf_core"]
